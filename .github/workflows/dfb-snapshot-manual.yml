name: DFB Snapshot – manueller Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Testmodus"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - empty
          - conflict

permissions:
  contents: write

jobs:
  update-dfb-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: DFB-Snapshot prüfen
        env:
          OSC_TEST_MODE: ${{ inputs.test_mode }}
        run: node scripts/update-dfb-snapshot.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- dfb-pokal-sportdaten.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gültigen Snapshot committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfb-pokal-sportdaten.json
          git commit -m "Update DFB-Pokal Sportdaten-Snapshot"
          git push
