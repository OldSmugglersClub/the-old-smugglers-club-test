name: Bundesliga Autoimport – Phase 5E gleicher Codepfad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5e:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Testkopie und API-Fixture vorbereiten
        run: node scripts/bundesliga-autoimport-phase5e-prepare.mjs

      - name: Exaktes Autoimport-Skript ausführen
        env:
          OSC_SPIELDATEN_PATH: spieldaten.phase5e-test.json
          OSC_API_FIXTURE_PATH: phase5e-api-fixture.json
          OSC_CHECK_AT: "2026-08-28T22:31:00+02:00"
        run: node scripts/bundesliga-ergebnisimport-auto.mjs

      - name: Ergebnis des gleichen Codepfads prüfen
        run: node scripts/bundesliga-autoimport-phase5e-verify.mjs

      - name: Echte spieldaten.json schützen
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json; then
            echo "BESTANDEN: echte spieldaten.json unverändert."
          else
            echo "FEHLER: echte spieldaten.json wurde verändert."
            git diff -- spieldaten.json
            exit 1
          fi

      - name: Lokalen Commit simulieren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f spieldaten.phase5e-test.json phase5e-api-fixture.json
          git commit -m "TEST Phase 5E Bundesliga Autoimport"
          echo "BESTANDEN: lokaler Commit erzeugt; kein Push."

      - name: Commit-Inhalt prüfen
        shell: bash
        run: |
          git diff HEAD^ HEAD --name-only
          if git diff HEAD^ HEAD --name-only | grep -qx "spieldaten.json"; then
            echo "FEHLER: echte spieldaten.json im Test-Commit."
            exit 1
          fi
          echo "BESTANDEN: echte spieldaten.json nicht im Test-Commit."
