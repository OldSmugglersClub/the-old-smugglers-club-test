name: Bundesliga Ergebnisimport – Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Bundesliga-Zuordnung und Ergebnisimport simulieren
        run: node scripts/bundesliga-import-dry-run.mjs

      - name: Prüfbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundesliga-import-vorschau
          path: bundesliga-import-vorschau.json
          retention-days: 7
          if-no-files-found: error
