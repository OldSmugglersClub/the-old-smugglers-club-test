name: Bundesliga Ergebnisse – automatisch

on:
  workflow_dispatch:
  schedule:
    # GitHub-Cron läuft in UTC. Der Workflow ist nur der Wecker.
    # Die Fachlogik entscheidet lokal, ob überhaupt ein OpenLigaDB-Abruf nötig ist.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: osc-bundesliga-ergebnisimport
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Bundesliga-Ergebnisimport prüfen
        run: node scripts/bundesliga-ergebnisimport-auto.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung an spieldaten.json – kein Commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Neue bestätigte Bundesliga-Ergebnisse liegen vor."
          fi

      - name: Neue bestätigte Ergebnisse committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spieldaten.json
          git commit -m "Bundesliga-Ergebnisse automatisch aktualisiert"
          git push
