name: Bundesliga Ergebnisimport – Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Testmodus"
        required: true
        default: "selftest"
        type: choice
        options:
          - selftest
          - live

permissions:
  contents: write

concurrency:
  group: osc-bundesliga-ergebnisimport
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Importlogik prüfen
        env:
          OSC_IMPORT_MODE: ${{ inputs.test_mode }}
        run: node scripts/bundesliga-ergebnisimport.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung an spieldaten.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "spieldaten.json wurde durch neue bestätigte Ergebnisse geändert."
          fi

      - name: Gültige Ergebnisänderungen committen
        if: inputs.test_mode == 'live' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spieldaten.json
          git commit -m "Bundesliga-Endergebnisse aktualisieren"
          git push
