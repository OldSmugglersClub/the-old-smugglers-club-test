<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL-KO-Fallback-Test – OSC</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:1180px;margin:35px auto;padding:0 18px;background:#111;color:#eee}
.box{border:1px solid #666;border-radius:12px;padding:20px;background:#1b1b1b;margin-bottom:20px}
.ok{color:#8fd18f}.warn{color:#f5c76d}.err{color:#ff9c9c}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px;border-bottom:1px solid #444;text-align:left}
code{word-break:break-all}
</style>
</head>
<body>
<div class="box">
<h1>Europa League – Fallback-Test</h1>
<p>Prüft die lokale Datei <code>europa-league-ko.json</code>.</p>
<p id="status">Abruf läuft …</p>
</div>

<div class="box">
<h2>Runden</h2>
<div id="details"></div>
</div>

<script>
const order = [
  ["achtelfinale","Achtelfinale",8],
  ["viertelfinale","Viertelfinale",4],
  ["halbfinale","Halbfinale",2],
  ["finale","Finale",1]
];

const esc=v=>String(v??"").replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));

(async()=>{
  const status=document.getElementById("status");
  const details=document.getElementById("details");

  try{
    const r=await fetch("./europa-league-ko.json",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);

    const data=await r.json();
    const rounds=data?.runden || {};
    let complete=true;
    let html="";

    for(const [key,label,expected] of order){
      const items=Array.isArray(rounds[key]) ? rounds[key] : [];
      if(items.length!==expected) complete=false;

      html+=`<h3>${esc(label)} – ${items.length}/${expected}</h3>`;
      if(!items.length){
        html+=`<p class="warn">Noch keine manuellen Paarungen hinterlegt.</p>`;
        continue;
      }

      html+=`<table><thead><tr><th>Paarung</th><th>Hin</th><th>Rück</th><th>Gesamt</th></tr></thead><tbody>`;
      for(const p of items){
        html+=`<tr>
          <td>${esc(p.team1)} – ${esc(p.team2)}</td>
          <td>${esc(p.hinspiel || "–")}</td>
          <td>${esc(p.rueckspiel || "–")}</td>
          <td>${esc(p.gesamt || "–")}</td>
        </tr>`;
      }
      html+="</tbody></table>";
    }

    status.className=complete?"ok":"warn";
    status.textContent=complete
      ? "Fallback vollständig – 15 Paarungen vorhanden."
      : "Fallback-Struktur gültig, aber noch nicht vollständig befüllt.";

    details.innerHTML=html;

  }catch(e){
    status.className="err";
    status.textContent="Fehler: "+(e.message||e);
  }
})();
</script>
</body>
</html>
