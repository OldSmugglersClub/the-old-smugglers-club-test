<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenLigaDB Champions-League-Test – TOSMC</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:1150px;margin:40px auto;padding:0 20px;background:#111;color:#eee}
.box{border:1px solid #666;border-radius:12px;padding:20px;background:#1b1b1b;margin-bottom:20px}
code{word-break:break-all}.ok{color:#8fd18f}.warn{color:#f5c76d}.err{color:#ff9c9c}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #444;text-align:left}
.round{margin-top:20px;padding-top:12px;border-top:1px solid #444}
</style>
</head>
<body>
<div class="box">
<h1>OpenLigaDB – Champions League 2025/26</h1>
<p>Isolierter Datencheck für <code>ucl</code>, Saison <code>2025</code>.</p>
<p id="summary">Abruf läuft …</p>
</div>
<div class="box">
<h2>Tabelle</h2>
<p><code>https://api.openligadb.de/getbltable/ucl/2025</code></p>
<p id="tableStatus">Abruf läuft …</p>
</div>
<div class="box">
<h2>Spiele / Runden</h2>
<p><code>https://api.openligadb.de/getmatchdata/ucl/2025</code></p>
<p id="matchStatus">Abruf läuft …</p>
<div id="details"></div>
</div>
<script>
const esc=v=>String(v??"").replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
(async()=>{
 const summary=document.getElementById("summary"), ts=document.getElementById("tableStatus"),
 ms=document.getElementById("matchStatus"), details=document.getElementById("details");
 try{
  const [tr,mr]=await Promise.all([
   fetch("https://api.openligadb.de/getbltable/ucl/2025",{cache:"no-store"}),
   fetch("https://api.openligadb.de/getmatchdata/ucl/2025",{cache:"no-store"})
  ]);
  if(!tr.ok) throw new Error("Tabelle HTTP "+tr.status);
  if(!mr.ok) throw new Error("Spiele HTTP "+mr.status);
  const table=await tr.json(), matches=await mr.json();
  ts.className=Array.isArray(table)&&table.length?"ok":"warn";
  ts.textContent=`Tabellenzeilen empfangen: ${Array.isArray(table)?table.length:0}.`;
  const rounds=new Map();
  (Array.isArray(matches)?matches:[]).forEach(m=>{
   const r=m.group?.groupName??m.group?.GroupName??"Ohne Rundenangabe";
   if(!rounds.has(r)) rounds.set(r,[]);
   rounds.get(r).push(m);
  });
  ms.className=matches.length?"ok":"warn";
  ms.textContent=`Spiele empfangen: ${matches.length} | Runden/Gruppen: ${rounds.size}.`;
  summary.className="ok";
  summary.textContent=`OpenLigaDB erreichbar. Tabelle: ${table.length} Zeilen | Spiele: ${matches.length}.`;
  let h=`<p><strong>Gefundene Runden:</strong> ${esc([...rounds.keys()].join(" | ")||"keine")}</p>`;
  for(const [r,games] of rounds){
   h+=`<div class="round"><h3>${esc(r)} – ${games.length} Spiele</h3><table><thead><tr><th>Datum</th><th>Paarung</th><th>beendet</th></tr></thead><tbody>`;
   for(const m of games){
    h+=`<tr><td>${esc(m.matchDateTime??"")}</td><td>${esc(m.team1?.teamName??"?")} – ${esc(m.team2?.teamName??"?")}</td><td>${m.matchIsFinished===true?"ja":"nein"}</td></tr>`;
   }
   h+="</tbody></table></div>";
  }
  details.innerHTML=h;
 }catch(e){
  summary.className=ts.className=ms.className="err";
  summary.textContent="OpenLigaDB-Abruf fehlgeschlagen.";
  ts.textContent=ms.textContent=String(e.message||e);
 }
})();
</script>
</body>
</html>
